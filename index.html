<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cozinha · Ana & Rafael</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="icon-192.png">
  <meta name="theme-color" content="#f4f1ea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cozinha">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <header class="topo">
    <div class="topo-inner">
      <div class="marca">
        <span class="emblema" aria-hidden="true">
          <svg viewBox="0 0 512 512" width="24" height="24">
            <ellipse cx="256" cy="300" rx="150" ry="28" fill="#eaf0ff"/>
            <path d="M120 300 A140 112 0 0 0 392 300 Z" fill="#eaf0ff"/>
            <g fill="none" stroke="#eaf0ff" stroke-width="20" stroke-linecap="round">
              <path d="M210 250 q-20 -24 0 -48"/><path d="M256 244 q-20 -24 0 -48"/><path d="M302 250 q-20 -24 0 -48"/>
            </g>
          </svg>
        </span>
        <div>
          <h1>Cozinha</h1>
          <p class="subtitulo">Ana &amp; Rafael</p>
        </div>
      </div>
      <button id="btn-config" class="link-sutil" aria-label="Configurações">Ajustes</button>
    </div>
  </header>
 
  <nav class="abas" role="tablist">
    <button class="aba ativa" data-aba="hoje">
      <svg class="aba-ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3"/></svg>
      <span>Hoje</span>
    </button>
    <button class="aba" data-aba="semana">
      <svg class="aba-ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17"/><path d="M8 3.5v3M16 3.5v3"/></svg>
      <span>Semana</span>
    </button>
    <button class="aba" data-aba="buscar">
      <svg class="aba-ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
      <span>Buscar</span>
    </button>
    <button class="aba" data-aba="lista">
      <svg class="aba-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 5.4l1 1 1.6-1.8M4 11.4l1 1 1.6-1.8M4 17.4l1 1 1.6-1.8"/></svg>
      <span>Lista</span>
    </button>
    <button class="aba" data-aba="perfil">
      <svg class="aba-ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 20c0-4 3.6-6.2 7.5-6.2s7.5 2.2 7.5 6.2"/></svg>
      <span>Perfil</span>
    </button>
  </nav>
 
  <main id="conteudo">
    <section id="hoje" class="painel ativo"></section>
    <section id="semana" class="painel"></section>
    <section id="buscar" class="painel"></section>
    <section id="lista" class="painel"></section>
    <section id="perfil" class="painel"></section>
  </main>
 
  <!-- Tela da receita (abre ao tocar num prato) -->
  <section id="tela-receita" class="tela-receita escondida"></section>
 
  <!-- Modal de configuração (sincronização com o GitHub) -->
  <div id="modal-config" class="modal escondido">
    <div class="modal-caixa">
      <h2>Sincronização</h2>
      <p class="ajuda">Normalmente não é preciso mexer aqui: a sincronização já vem configurada
        no app. Este campo é só para casos avançados (trocar o endereço do mini-servidor).</p>
      <label>URL de sincronização (opcional)
        <input id="cfg-worker" type="text" placeholder="https://....workers.dev" autocomplete="off">
      </label>
      <p class="ajuda" id="cfg-status"></p>
      <div class="modal-acoes">
        <button id="cfg-salvar" class="btn">Salvar</button>
        <button id="cfg-fechar" class="link-sutil">Fechar</button>
      </div>
    </div>
  </div>
 
  <footer class="rodape">
    <span id="rodape-atualizado"></span>
  </footer>
 
  <script src="app.js"></script>
</body>
</html>
